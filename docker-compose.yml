services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: construction-change-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/construction_db
      - REDIS_URL=redis://redis:6379/0
      - JOBS_ENABLED=true
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: construction-change-worker
    command: arq app.kernel.jobs.worker.WorkerSettings
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/construction_db
      - REDIS_URL=redis://redis:6379/0
      - JOBS_ENABLED=true
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: construction-change-redis
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    container_name: construction-change-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=construction_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
