[pytest]
testpaths = tests
python_files = test_*.py
# Tambahkan root `backend/` ke sys.path agar `from app...` bekerja baik saat
# dipanggil `pytest` langsung (CI) maupun `python -m pytest` (lokal).
pythonpath = .
markers =
    slow: memuat EasyOCR/torch dan model OCR; dilewati di CI, jalankan lokal.
filterwarnings =
    ignore::DeprecationWarning
